<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章工坊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局：清新淡色系 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #f5f7fa;
            --bg-card: #ffffff;
            --bg-input: #f0f2f5;
            --bg-hover: #e8ebf0;
            --border-color: #e2e6ec;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #5b7cfa;
            --accent-hover: #4a6ae0;
            --accent-light: #eef1ff;
            --green: #22c55e;
            --green-light: #e6f9ed;
            --red: #ef4444;
            --red-light: #fde8e8;
            --yellow: #eab308;
            --yellow-light: #fef9e7;
            --radius: 12px;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 6px 24px rgba(0, 0, 0, 0.10);
            --transition: 0.2s ease;
        }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            padding: 24px;
        }

        .app-wrapper {
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 24px;
            align-items: start;
        }

        .main-col {
            min-width: 0;
        }

        .sidebar-col {
            position: sticky;
            top: 24px;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            padding: 20px 0 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .header h1 span {
            color: var(--accent);
        }

        .header p {
            color: var(--text-muted);
            margin-top: 4px;
            font-size: 14px;
        }

        /* ===== 卡片通用 ===== */
        .card-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 18px 22px 22px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: box-shadow var(--transition);
        }

        .card-box:hover {
            box-shadow: var(--shadow-hover);
        }

        .card-box .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-box .card-title i {
            color: var(--accent);
            font-size: 15px;
            width: 20px;
            text-align: center;
        }

        .status-badge {
            font-size: 12px;
            padding: 3px 14px;
            border-radius: 30px;
            background: var(--bg-input);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            font-weight: 500;
        }

        .status-badge.ready {
            color: var(--green);
            border-color: var(--green);
            background: var(--green-light);
        }

        .status-badge.error {
            color: var(--red);
            border-color: var(--red);
            background: var(--red-light);
        }

        .status-badge.generating {
            color: var(--yellow);
            border-color: var(--yellow);
            background: var(--yellow-light);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ===== 批量提取 ===== */
        .batch-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: stretch;
            flex-wrap: wrap;
        }

        .batch-row textarea {
            flex: 3;
            min-width: 180px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 12px;
            font-family: 'SF Mono', 'Courier New', monospace;
            outline: none;
            transition: border var(--transition);
            resize: vertical;
            height: 72px;
            line-height: 1.6;
        }

        .batch-row textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.12);
        }

        .batch-row textarea::placeholder {
            color: var(--text-muted);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .batch-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: center;
        }

        .batch-actions button {
            padding: 5px 16px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            height: 30px;
        }

        .btn-extract {
            background: var(--accent);
            color: #fff;
        }
        .btn-extract:hover {
            background: var(--accent-hover);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .btn-ghost:hover {
            border-color: var(--red);
            color: var(--red);
        }

        .hint-tags {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }

        .hint-tags .tag {
            background: var(--bg-input);
            padding: 1px 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 10px;
            color: var(--text-muted);
        }

        /* ===== 配置行 ===== */
        .config-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }

        .config-row .field {
            flex: 1;
            min-width: 120px;
        }

        .config-row .field label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 3px;
            font-weight: 500;
        }

        .config-row .field input {
            width: 100%;
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: all var(--transition);
            font-family: inherit;
        }

        .config-row .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.12);
        }

        .config-row .field input.extracted {
            border-color: var(--green);
            background: var(--green-light);
        }

        .config-row .field input.extracted-fail {
            border-color: var(--red);
            background: var(--red-light);
        }

        .config-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .config-actions button {
            padding: 7px 18px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            height: 36px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* ===== 提示词区 ===== */
        .prompt-section textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'SF Mono', 'Courier New', monospace;
            outline: none;
            transition: border var(--transition);
            resize: vertical;
            line-height: 1.7;
        }

        .prompt-section textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.12);
        }

        .prompt-section .prompt-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .prompt-section .prompt-toolbar label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .prompt-section .prompt-toolbar label i {
            color: var(--accent);
        }

        .prompt-section .prompt-toolbar .actions {
            display: flex;
            gap: 6px;
        }

        .prompt-section .prompt-toolbar .actions button {
            padding: 3px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            background: transparent;
            color: var(--text-muted);
        }

        .prompt-section .prompt-toolbar .actions button:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .prompt-section .prompt-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }

        .prompt-section .prompt-hint code {
            background: var(--bg-input);
            padding: 0 6px;
            border-radius: 4px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* ===== 进度条 ===== */
        .progress-container {
            display: none;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 16px 20px 18px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .progress-container.visible {
            display: block;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .progress-header .label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-header .label .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: var(--bg-input);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .progress-log {
            margin-top: 10px;
            max-height: 100px;
            overflow-y: auto;
            font-size: 12px;
            font-family: 'SF Mono', 'Courier New', monospace;
            color: var(--text-muted);
            background: var(--bg-input);
            border-radius: 6px;
            padding: 6px 12px;
            line-height: 1.8;
        }

        .progress-log .entry {
            opacity: 0.7;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
            padding: 1px 0;
        }

        .progress-log .entry.done {
            opacity: 1;
            color: var(--green);
        }

        .progress-log .entry.error {
            opacity: 1;
            color: var(--red);
        }

        .progress-log .entry .time {
            color: var(--text-muted);
            margin-right: 8px;
            font-size: 10px;
        }

        /* ===== 领域选择 ===== */
        .category-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .category-selector button {
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
        }

        .category-selector button:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .category-selector button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .category-selector button .count {
            font-size: 11px;
            opacity: 0.6;
            margin-left: 4px;
        }

        /* ===== 生成控制 ===== */
        .generate-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 12px 18px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .generate-bar .info {
            color: var(--text-muted);
            font-size: 13px;
            flex: 1;
            min-width: 100px;
        }

        .generate-bar .info strong {
            color: var(--text-secondary);
        }

        .generate-bar button {
            padding: 8px 22px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .generate-bar .btn-generate {
            background: var(--accent);
            color: #fff;
        }
        .generate-bar .btn-generate:hover:not(:disabled) {
            background: var(--accent-hover);
        }
        .generate-bar .btn-generate:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .generate-bar .btn-export {
            background: var(--green);
            color: #fff;
        }
        .generate-bar .btn-export:hover {
            opacity: 0.85;
        }

        .generate-bar .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .generate-bar .btn-ghost:hover {
            border-color: var(--red);
            color: var(--red);
        }

        /* ===== 文章网格 ===== */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 4px;
        }

        .article-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 16px 18px 18px;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .article-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-hover);
        }

        .article-card .card-category {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
        }

        .article-card .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-card .card-summary {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .article-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .article-card .card-footer .status {
            font-size: 11px;
            color: var(--text-muted);
        }

        .article-card .card-footer .status.done {
            color: var(--green);
        }

        .article-card .card-footer .actions {
            display: flex;
            gap: 8px;
        }

        .article-card .card-footer .actions button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: color var(--transition);
            padding: 3px 5px;
        }

        .article-card .card-footer .actions button:hover {
            color: var(--accent);
        }

        .article-card .card-footer .actions button.copy-btn:hover {
            color: var(--green);
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.3;
            color: var(--text-muted);
        }

        .empty-state h3 {
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 4px;
        }

        /* ===== 问答面板 ===== */
        .qa-panel {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 18px 20px 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
            max-height: 780px;
            min-height: 480px;
        }

        .qa-panel .qa-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .qa-panel .qa-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qa-panel .qa-header h3 i {
            color: var(--accent);
        }

        .qa-panel .qa-header .qa-status {
            font-size: 11px;
            color: var(--text-muted);
            padding: 2px 12px;
            border-radius: 20px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
        }

        .qa-panel .qa-header .qa-status.online {
            color: var(--green);
            border-color: var(--green);
            background: var(--green-light);
        }

        .qa-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 4px;
            min-height: 0;
        }

        .qa-messages .msg {
            margin-bottom: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 92%;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
            animation: fadeInMsg 0.2s ease;
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .qa-messages .msg.user {
            background: var(--accent);
            color: #fff;
            margin-left: auto;
            border-bottom-right-radius: 3px;
        }

        .qa-messages .msg.assistant {
            background: var(--bg-input);
            color: var(--text-secondary);
            border-bottom-left-radius: 3px;
        }

        .qa-messages .msg .time-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
            opacity: 0.6;
        }

        .qa-messages .msg.error {
            background: var(--red-light);
            color: var(--red);
            border: 1px solid rgba(239, 68, 68, 0.15);
        }

        .qa-messages .msg.loading {
            background: var(--bg-input);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qa-messages .msg.loading .dots span {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--text-muted);
            margin: 0 2px;
            animation: dotBounce 1.2s ease-in-out infinite;
        }

        .qa-messages .msg.loading .dots span:nth-child(2) { animation-delay: 0.2s; }
        .qa-messages .msg.loading .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .qa-input-area {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            align-items: flex-end;
        }

        .qa-input-area textarea {
            flex: 1;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border var(--transition);
            resize: none;
            min-height: 40px;
            max-height: 100px;
            font-family: inherit;
            line-height: 1.5;
        }

        .qa-input-area textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.12);
        }

        .qa-input-area textarea::placeholder {
            color: var(--text-muted);
        }

        .qa-input-area .qa-send-btn {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            height: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qa-input-area .qa-send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .qa-input-area .qa-send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .qa-input-area .qa-clear-btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            height: 40px;
            display: flex;
            align-items: center;
        }

        .qa-input-area .qa-clear-btn:hover {
            border-color: var(--red);
            color: var(--red);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 22px;
            box-shadow: var(--shadow-hover);
            color: var(--text-primary);
            font-size: 14px;
            z-index: 999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
            max-width: 400px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast .toast-icon {
            margin-right: 10px;
        }
        .toast.success .toast-icon { color: var(--green); }
        .toast.error .toast-icon { color: var(--red); }
        .toast.info .toast-icon { color: var(--accent); }

        /* ===== 响应式 ===== */
        @media (max-width: 1024px) {
            .app-wrapper {
                grid-template-columns: 1fr;
            }
            .sidebar-col {
                position: static;
                top: auto;
            }
            .qa-panel {
                height: 480px;
                max-height: 480px;
                min-height: 380px;
            }
        }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .header h1 { font-size: 20px; }
            .card-box { padding: 14px 16px 16px; }
            .batch-row { flex-direction: column; }
            .batch-row textarea { height: 56px; }
            .batch-actions { flex-direction: row; }
            .config-row { flex-direction: column; align-items: stretch; }
            .config-row .field { min-width: unset; }
            .config-actions { justify-content: stretch; }
            .config-actions button { flex: 1; }
            .articles-grid { grid-template-columns: 1fr; }
            .generate-bar { flex-direction: column; align-items: stretch; gap: 8px; }
            .generate-bar .info { text-align: center; }
            .category-selector { justify-content: center; }
            .category-selector button { font-size: 12px; padding: 5px 14px; }
            .toast { left: 16px; right: 16px; bottom: 16px; max-width: unset; }
            .qa-panel { height: 400px; max-height: 400px; min-height: 320px; padding: 14px 16px 16px; }
            .qa-input-area textarea { font-size: 12px; padding: 6px 12px; min-height: 36px; }
            .qa-input-area .qa-send-btn { padding: 6px 14px; font-size: 12px; height: 36px; }
            .qa-input-area .qa-clear-btn { height: 36px; padding: 6px 10px; }
            .qa-messages .msg { font-size: 12px; padding: 8px 12px; }
            .progress-log { max-height: 70px; font-size: 11px; }
            .prompt-section textarea { min-height: 80px; font-size: 12px; }
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- ===== 主栏 ===== -->
    <div class="main-col">
        <header class="header">
            <h1>热点<span>搜罗</span> · 文章工坊</h1>
            <p>AI 自动生成各领域热点文章 · 一键复制</p>
        </header>

        <!-- API 配置 -->
        <div class="card-box">
            <div class="card-title">
                <i class="fas fa-key"></i> API 配置
                <span class="status-badge" id="apiStatus" style="margin-left:auto;">未配置</span>
            </div>

            <div class="batch-row">
                <textarea id="batchInput" placeholder="粘贴配置信息，自动提取三个参数&#10;支持：key: value / key=value / JSON / 纯文本三行"></textarea>
                <div class="batch-actions">
                    <button class="btn-extract" id="extractBtn">提取</button>
                    <button class="btn-ghost" id="clearBatchBtn">清空</button>
                </div>
            </div>
            <div class="hint-tags">
                <span class="tag">key: value</span>
                <span class="tag">key=value</span>
                <span class="tag">JSON</span>
                <span class="tag">纯文本三行</span>
                <span style="color:var(--text-muted);margin-left:4px;">自动识别格式</span>
            </div>

            <div class="config-row" style="margin-top:12px;">
                <div class="field">
                    <label>API Key</label>
                    <input type="text" id="apiKeyInput" placeholder="sk-..." />
                </div>
                <div class="field">
                    <label>Base URL</label>
                    <input type="text" id="baseUrlInput" value="https://api.siliconflow.cn/v1" />
                </div>
                <div class="field">
                    <label>模型名称</label>
                    <input type="text" id="modelInput" value="THUDM/GLM-4-9B-0414" placeholder="模型名" />
                </div>
                <div class="config-actions">
                    <button class="btn-primary" id="saveApiBtn">保存</button>
                    <button class="btn-secondary" id="testApiBtn">测试</button>
                </div>
            </div>
            <div style="margin-top:8px;font-size:12px;color:var(--text-muted);">
                支持 OpenAI 兼容接口，模型名可自由填写
            </div>
        </div>

        <!-- 提示词 -->
        <div class="card-box prompt-section">
            <div class="prompt-toolbar">
                <label><i class="fas fa-pen"></i> 生成提示词</label>
                <div class="actions">
                    <button id="resetPromptBtn">恢复默认</button>
                    <button id="applyPromptBtn" style="border-color:var(--accent);color:var(--accent);">应用</button>
                </div>
            </div>
            <textarea id="promptEditor"></textarea>
            <div class="prompt-hint">
                <span><code>{category}</code> 会被替换为当前领域名称</span>
                <span class="char-count" id="charCount">0 字符</span>
            </div>
        </div>

        <!-- 进度 -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-header">
                <div class="label"><span class="spinner"></span><span id="progressLabel">生成中...</span></div>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-log" id="progressLog"><div class="entry">准备开始...</div></div>
        </div>

        <!-- 领域 -->
        <div class="category-selector" id="categorySelector">
            <button class="active" data-cat="entertainment">娱乐</button>
            <button data-cat="technology">科技</button>
            <button data-cat="politics">政治</button>
            <button data-cat="lifestyle">生活</button>
            <button data-cat="business">财经</button>
            <button data-cat="sports">体育</button>
        </div>

        <!-- 生成控制 -->
        <div class="generate-bar">
            <div class="info"><strong id="articleCountDisplay">0</strong> 篇 · <span id="currentCategoryLabel">娱乐</span></div>
            <button class="btn-generate" id="generateBtn">生成 6 篇</button>
            <button class="btn-export" id="exportAllBtn">复制全部</button>
            <button class="btn-ghost" id="clearBtn">清空</button>
        </div>

        <!-- 文章 -->
        <div class="articles-grid" id="articlesGrid">
            <div class="empty-state">
                <div class="icon">📄</div>
                <h3>还没有文章</h3>
                <p>配置 API 后点击「生成 6 篇」</p>
            </div>
        </div>
    </div>

    <!-- ===== 侧边栏：问答 ===== -->
    <div class="sidebar-col">
        <div class="qa-panel">
            <div class="qa-header">
                <h3><i class="fas fa-comment"></i> 直接问答</h3>
                <span class="qa-status" id="qaStatus">就绪</span>
            </div>
            <div class="qa-messages" id="qaMessages">
                <div class="msg assistant">
                    你好！我是 AI 助手，可以回答你的问题。<br />
                    输入问题，按 Ctrl+Enter 发送。
                    <span class="time-label">系统</span>
                </div>
            </div>
            <div class="qa-input-area">
                <textarea id="qaInput" rows="1" placeholder="输入问题..."></textarea>
                <button class="qa-send-btn" id="qaSendBtn">发送</button>
                <button class="qa-clear-btn" id="qaClearBtn" title="清空对话"><i class="fas fa-eraser"></i></button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
    <span class="toast-icon"><i class="fas fa-check-circle"></i></span>
    <span class="toast-message">操作成功</span>
</div>

<script>
    // ============================================================
    //  配置 & 状态
    // ============================================================
    const CONFIG = {
        apiKey: localStorage.getItem('hotspot_api_key') || '',
        baseUrl: localStorage.getItem('hotspot_base_url') || 'https://api.siliconflow.cn/v1',
        model: localStorage.getItem('hotspot_model') || 'THUDM/GLM-4-9B-0414'
    };

    const DEFAULT_PROMPT = `请为「{category}」领域生成 6 篇热点文章。

要求：
1. 每篇文章聚焦一个当前{category}领域的热点事件或趋势
2. 内容要有深度，有具体信息、数据或案例支撑
3. 风格类似公众号深度文章，语言生动
4. 每篇正文 200-300 字

请严格按照格式输出，用 "---" 分隔每篇文章。`;

    let customPrompt = localStorage.getItem('hotspot_custom_prompt') || DEFAULT_PROMPT;
    let allArticles = {};
    let isGenerating = false;
    let currentCategory = 'entertainment';
    let isQaLoading = false;
    let qaHistory = [];

    const CATEGORY_LABELS = {
        entertainment: '娱乐',
        technology: '科技',
        politics: '政治',
        lifestyle: '生活',
        business: '财经',
        sports: '体育'
    };

    for (const key of Object.keys(CATEGORY_LABELS)) {
        allArticles[key] = [];
    }

    // ============================================================
    //  DOM 引用
    // ============================================================
    const $ = id => document.getElementById(id);
    const apiKeyInput = $('apiKeyInput');
    const baseUrlInput = $('baseUrlInput');
    const modelInput = $('modelInput');
    const batchInput = $('batchInput');
    const extractBtn = $('extractBtn');
    const clearBatchBtn = $('clearBatchBtn');
    const saveApiBtn = $('saveApiBtn');
    const testApiBtn = $('testApiBtn');
    const apiStatus = $('apiStatus');
    const generateBtn = $('generateBtn');
    const exportAllBtn = $('exportAllBtn');
    const clearBtn = $('clearBtn');
    const articlesGrid = $('articlesGrid');
    const articleCountDisplay = $('articleCountDisplay');
    const currentCategoryLabel = $('currentCategoryLabel');
    const toast = $('toast');
    const promptEditor = $('promptEditor');
    const resetPromptBtn = $('resetPromptBtn');
    const applyPromptBtn = $('applyPromptBtn');
    const charCount = $('charCount');
    const progressContainer = $('progressContainer');
    const progressLabel = $('progressLabel');
    const progressPercent = $('progressPercent');
    const progressFill = $('progressFill');
    const progressLog = $('progressLog');
    const qaMessages = $('qaMessages');
    const qaInput = $('qaInput');
    const qaSendBtn = $('qaSendBtn');
    const qaClearBtn = $('qaClearBtn');
    const qaStatus = $('qaStatus');

    // ============================================================
    //  提示词
    // ============================================================
    function loadPrompt() { promptEditor.value = customPrompt; updateCharCount(); }

    function updateCharCount() {
        const len = promptEditor.value.length;
        charCount.textContent = len + ' 字符';
    }

    function applyPrompt() {
        customPrompt = promptEditor.value;
        localStorage.setItem('hotspot_custom_prompt', customPrompt);
        showToast('提示词已更新', 'success');
    }

    function resetPrompt() {
        promptEditor.value = DEFAULT_PROMPT;
        applyPrompt();
        showToast('已恢复默认', 'info');
    }

    promptEditor.addEventListener('input', updateCharCount);
    resetPromptBtn.addEventListener('click', resetPrompt);
    applyPromptBtn.addEventListener('click', applyPrompt);

    // ============================================================
    //  Toast
    // ============================================================
    let toastTimer = null;

    function showToast(message, type = 'info', duration = 2500) {
        const iconMap = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
        toast.className = `toast ${type}`;
        toast.querySelector('.toast-icon i').className = `fas ${iconMap[type] || iconMap.info}`;
        toast.querySelector('.toast-message').textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    // ============================================================
    //  进度
    // ============================================================
    function showProgress(show) {
        progressContainer.classList.toggle('visible', show);
        if (!show) progressLog.innerHTML = '';
    }

    function addLog(message, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.className = `entry ${type}`;
        entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
        progressLog.appendChild(entry);
        progressLog.scrollTop = progressLog.scrollHeight;
        console.log(`[${time}] ${message}`);
    }

    function updateProgress(percent, label) {
        progressFill.style.width = Math.min(percent, 100) + '%';
        progressPercent.textContent = Math.min(Math.round(percent), 100) + '%';
        if (label) progressLabel.textContent = label;
    }

    // ============================================================
    //  提取逻辑
    // ============================================================
    function extractApiConfig() {
        const text = batchInput.value.trim();
        if (!text) { showToast('请粘贴配置信息', 'error'); return; }

        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length === 0) { showToast('未检测到有效内容', 'error'); return; }

        // JSON
        try {
            const json = JSON.parse(text);
            const extracted = {
                apiKey: json.api_key || json.apiKey || '',
                baseUrl: json.base_url || json.baseUrl || '',
                model: json.model || ''
            };
            if (extracted.apiKey || extracted.baseUrl || extracted.model) {
                fillExtracted(extracted);
                const count = [extracted.apiKey, extracted.baseUrl, extracted.model].filter(Boolean).length;
                showToast(`提取 ${count}/3 个参数`, count === 3 ? 'success' : 'info');
                if (count === 3) saveConfig();
                return;
            }
        } catch {}

        const result = { apiKey: '', baseUrl: '', model: '' };
        const used = [];

        for (let i = 0; i < lines.length; i++) {
            const parsed = parseLine(lines[i]);
            if (parsed) {
                const { key, value } = parsed;
                if (key === 'apiKey' && !result.apiKey) { result.apiKey = value;
                    used.push(i); } else if (key === 'baseUrl' && !result.baseUrl) { result.baseUrl = value;
                    used.push(i); } else if (key === 'model' && !result.model) { result.model = value;
                    used.push(i); }
            }
        }

        for (let i = 0; i < lines.length; i++) {
            if (used.includes(i)) continue;
            const line = lines[i];
            if (!result.apiKey) { const m = line.match(/(sk-[a-zA-Z0-9]{20,})/); if (m) { result.apiKey = m[1];
                    used.push(i); continue; } }
            if (!result.baseUrl) { const m = line.match(/(https?:\/\/[^\s"',;<>]+)/); if (m && m[1].length > 10) { result.baseUrl = m[1];
                    used.push(i); continue; } }
            if (!result.model) {
                const isUrl = /^https?:\/\//.test(line);
                const isKey = /^sk-/.test(line);
                if (!isUrl && !isKey && line.length > 0 && line.length < 100 && !/^\d+$/.test(line)) {
                    result.model = line;
                    used.push(i);
                }
            }
        }

        const remaining = lines.filter((_, i) => !used.includes(i));
        if (!result.apiKey) { for (const l of remaining) { if (/^sk-/.test(l) || l.length > 20) { result.apiKey = l; break; } } }
        if (!result.baseUrl) { for (const l of remaining) { if (/^https?:\/\//.test(l) && l.length > 10) { result.baseUrl = l; break; } } }
        if (!result.model) { for (const l of remaining) { if (!/^https?:\/\//.test(l) && !/^sk-/.test(l) && l.length > 2 && l.length < 100) { result.model = l; break; } } }

        // 清理
        if (result.apiKey) result.apiKey = result.apiKey.replace(/^["'\s,，]+|["'\s,，]+$/g, '');
        if (result.baseUrl) result.baseUrl = result.baseUrl.replace(/^["'\s,，]+|["'\s,，]+$/g, '');
        if (result.model) result.model = result.model.replace(/^["'\s,，]+|["'\s,，]+$/g, '');

        fillExtracted(result);
        const count = [result.apiKey, result.baseUrl, result.model].filter(Boolean).length;
        showToast(`提取 ${count}/3 个参数`, count === 3 ? 'success' : 'info');
        if (count === 3) saveConfig();
    }

    function parseLine(line) {
        for (const sep of [':', '=', '：', '→', '->', '—']) {
            const idx = line.indexOf(sep);
            if (idx > 0 && idx < line.length - 1) {
                const key = line.substring(0, idx).trim().toLowerCase();
                const value = line.substring(idx + 1).trim();
                if (key && value) {
                    const nk = normalizeKey(key);
                    if (nk) return { key: nk, value };
                }
            }
        }
        return null;
    }

    function normalizeKey(k) {
        const key = k.replace(/[_\s\-]/g, '').toLowerCase();
        if (key.includes('apikey') || key === 'key') return 'apiKey';
        if (key.includes('baseurl') || (key.includes('base') && key.includes('url'))) return 'baseUrl';
        if (key.includes('model') || key === 'modelname') return 'model';
        return null;
    }

    function fillExtracted(e) {
        if (e.apiKey) { apiKeyInput.value = e.apiKey;
            apiKeyInput.className = 'extracted'; } else apiKeyInput.className = 'extracted-fail';
        if (e.baseUrl) { baseUrlInput.value = e.baseUrl;
            baseUrlInput.className = 'extracted'; } else baseUrlInput.className = 'extracted-fail';
        if (e.model) { modelInput.value = e.model;
            modelInput.className = 'extracted'; } else modelInput.className = 'extracted-fail';
    }

    extractBtn.addEventListener('click', extractApiConfig);
    clearBatchBtn.addEventListener('click', () => { batchInput.value = '';
        showToast('已清空', 'info'); });
    batchInput.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault();
            extractApiConfig(); } });

    // ============================================================
    //  API 配置
    // ============================================================
    function loadConfig() {
        apiKeyInput.value = CONFIG.apiKey || '';
        baseUrlInput.value = CONFIG.baseUrl || 'https://api.siliconflow.cn/v1';
        modelInput.value = CONFIG.model || 'THUDM/GLM-4-9B-0414';
        updateStatus();
        if (CONFIG.apiKey) apiKeyInput.className = 'extracted';
        if (CONFIG.baseUrl) baseUrlInput.className = 'extracted';
        if (CONFIG.model) modelInput.className = 'extracted';
    }

    function saveConfig() {
        CONFIG.apiKey = apiKeyInput.value.trim();
        CONFIG.baseUrl = baseUrlInput.value.trim();
        CONFIG.model = modelInput.value.trim() || 'THUDM/GLM-4-9B-0414';
        localStorage.setItem('hotspot_api_key', CONFIG.apiKey);
        localStorage.setItem('hotspot_base_url', CONFIG.baseUrl);
        localStorage.setItem('hotspot_model', CONFIG.model);
        updateStatus();
        showToast('配置已保存', 'success');
    }

    function updateStatus() {
        if (CONFIG.apiKey && CONFIG.apiKey.length > 5) {
            apiStatus.textContent = '已配置';
            apiStatus.className = 'status-badge ready';
        } else {
            apiStatus.textContent = '未配置';
            apiStatus.className = 'status-badge';
        }
    }

    async function testApi() {
        if (!CONFIG.apiKey) { showToast('请先保存 API Key', 'error'); return; }
        testApiBtn.disabled = true;
        testApiBtn.textContent = '测试中...';
        try {
            const r = await fetch(`${CONFIG.baseUrl}/models`, { headers: { 'Authorization': `Bearer ${CONFIG.apiKey}` } });
            if (r.ok) {
                showToast('API 连接成功', 'success');
                apiStatus.textContent = '已连接';
                apiStatus.className = 'status-badge ready';
            } else {
                showToast(`测试失败: ${r.status}`, 'error');
                apiStatus.textContent = '连接失败';
                apiStatus.className = 'status-badge error';
            }
        } catch (e) {
            showToast(`网络错误: ${e.message}`, 'error');
            apiStatus.textContent = '网络错误';
            apiStatus.className = 'status-badge error';
        }
        testApiBtn.disabled = false;
        testApiBtn.textContent = '测试';
    }

    saveApiBtn.addEventListener('click', saveConfig);
    testApiBtn.addEventListener('click', testApi);
    [apiKeyInput, baseUrlInput, modelInput].forEach(inp => {
        inp.addEventListener('input', function() { this.className = this.value ? 'extracted' : ''; });
    });

    // ============================================================
    //  调用 LLM
    // ============================================================
    async function callLLM(messages, onProgress) {
        if (!CONFIG.apiKey) throw new Error('请先配置 API Key');
        const model = CONFIG.model || 'THUDM/GLM-4-9B-0414';
        if (onProgress) onProgress('连接 API...', 10);
        const r = await fetch(`${CONFIG.baseUrl}/chat/completions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${CONFIG.apiKey}` },
            body: JSON.stringify({ model, messages, temperature: 0.7, max_tokens: 2000, stream: false })
        });
        if (onProgress) onProgress('等待响应...', 30);
        if (!r.ok) { let t = await r.text(); throw new Error(`API 请求失败: ${r.status} ${t}`); }
        if (onProgress) onProgress('解析响应...', 60);
        const data = await r.json();
        if (!data.choices) throw new Error('API 返回格式异常');
        return data.choices[0].message.content;
    }

    // ============================================================
    //  文章生成
    // ============================================================
    function parseArticles(text, category) {
        const result = [];
        const label = CATEGORY_LABELS[category] || category;
        const blocks = text.split('---').filter(b => b.trim());
        for (let idx = 0; idx < blocks.length; idx++) {
            const block = blocks[idx];
            let title = '',
                body = '',
                summary = '';
            const lines = block.trim().split('\n');
            for (const line of lines) {
                const t = line.trim();
                if (t.startsWith('标题：') || t.startsWith('标题:')) title = t.replace(/^标题[:：]\s*/, '').trim();
                else if (t.startsWith('正文：') || t.startsWith('正文:')) body = t.replace(/^正文[:：]\s*/, '').trim();
                else if (t.startsWith('总结：') || t.startsWith('总结:')) summary = t.replace(/^总结[:：]\s*/, '').trim();
                else if (!title && t.length > 0 && t.length < 40) title = t;
                else if (t.length > 0) body += (body ? ' ' : '') + t;
            }
            if (!title && body) title = body.slice(0, 30) + (body.length > 30 ? '...' : '');
            if (!summary && body) summary = body.slice(0, 50) + (body.length > 50 ? '...' : '');
            if (title || body) {
                result.push({
                    id: `a-${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 5)}`,
                    category,
                    categoryLabel: label,
                    title: title || '热点话题',
                    body: body || '内容待补充',
                    summary: summary || body.slice(0, 60) + '...',
                    createdAt: new Date().toLocaleString('zh-CN')
                });
            }
        }
        return result;
    }

    async function generateArticles(category) {
        if (isGenerating) return;
        if (!CONFIG.apiKey) { showToast('请先配置 API Key', 'error'); return; }

        const label = CATEGORY_LABELS[category] || category;
        isGenerating = true;
        generateBtn.disabled = true;
        generateBtn.textContent = '生成中...';

        showProgress(true);
        progressLog.innerHTML = '';
        addLog(`开始生成「${label}」文章`, 'info');
        addLog(`模型: ${CONFIG.model}`, 'info');
        updateProgress(5, '准备...');

        try {
            const prompt = customPrompt.replace(/\{category\}/g, label);
            const msgs = [
                { role: 'system', content: `你是一位资深新闻编辑。生成6篇热点文章，每篇包含：标题(15-25字)、正文(200-300字)、总结(30字内)。用 "---" 分隔，每篇用 "标题："、"正文："、"总结：" 标记。` },
                { role: 'user', content: prompt }
            ];
            addLog('发送请求...', 'info');
            const result = await callLLM(msgs, (l, p) => { updateProgress(p, l);
                addLog(l, 'info'); });

            updateProgress(85, '解析文章...');
            addLog('解析响应...', 'info');

            let parsed = parseArticles(result, category);
            while (parsed.length < 6) {
                const idx = parsed.length + 1;
                parsed.push({
                    id: `f-${Date.now()}-${idx}`,
                    category,
                    categoryLabel: label,
                    title: `${label}热点 ${idx}`,
                    body: `${label}领域近期受到广泛关注，各方观点交织，热度持续。`,
                    summary: `${label}领域持续引发讨论。`,
                    createdAt: new Date().toLocaleString('zh-CN')
                });
                addLog(`补充第 ${idx} 篇`, 'info');
            }
            allArticles[category] = parsed.slice(0, 6);
            updateProgress(100, '完成！');
            addLog(`生成 ${parsed.slice(0, 6).length} 篇文章`, 'done');
            showToast(`生成完成`, 'success');
            renderArticles();
            setTimeout(() => showProgress(false), 2500);
        } catch (err) {
            addLog(`失败: ${err.message}`, 'error');
            showToast(`生成失败: ${err.message}`, 'error');
        }
        isGenerating = false;
        generateBtn.disabled = false;
        generateBtn.textContent = '生成 6 篇';
    }

    // ============================================================
    //  渲染文章
    // ============================================================
    function renderArticles() {
        const articles = allArticles[currentCategory] || [];
        const label = CATEGORY_LABELS[currentCategory] || currentCategory;
        currentCategoryLabel.textContent = label;
        if (!articles.length) {
            articlesGrid.innerHTML =
                `<div class="empty-state"><div class="icon">📄</div><h3>还没有 ${label} 文章</h3><p>点击「生成 6 篇」</p></div>`;
            articleCountDisplay.textContent = '0';
            return;
        }
        articleCountDisplay.textContent = articles.length;
        articlesGrid.innerHTML = articles.map((a, i) => `
            <div class="article-card">
                <div class="card-category">${a.categoryLabel} · #${i+1}</div>
                <div class="card-title">${esc(a.title)}</div>
                <div class="card-summary">${esc(a.summary)}</div>
                <div class="card-footer">
                    <span class="status done">${a.createdAt || '刚刚'}</span>
                    <div class="actions">
                        <button class="copy-btn" onclick="copyArticle('${a.id}')"><i class="fas fa-copy"></i></button>
                        <button onclick="viewArticle('${a.id}')"><i class="fas fa-eye"></i></button>
                        <button onclick="deleteArticle('${a.id}')" style="color:var(--text-muted);"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function esc(t) { if (!t) return ''; const d = document.createElement('div');
        d.textContent = t; return d.innerHTML; }

    window.copyArticle = function(id) {
        const a = allArticles[currentCategory]?.find(x => x.id === id);
        if (!a) { showToast('文章不存在', 'error'); return; }
        const content = `【${a.categoryLabel}】${a.title}\n\n${a.body}\n\n—— ${a.summary}`;
        navigator.clipboard?.writeText(content).then(() => showToast('已复制', 'success')).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = content;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('已复制', 'success');
        });
    };

    window.viewArticle = function(id) {
        const a = allArticles[currentCategory]?.find(x => x.id === id);
        if (!a) return;
        alert(`【${a.categoryLabel}】${a.title}\n\n${a.body}\n\n📌 ${a.summary}`);
    };

    window.deleteArticle = function(id) {
        if (!confirm('删除？')) return;
        allArticles[currentCategory] = allArticles[currentCategory].filter(x => x.id !== id);
        renderArticles();
        showToast('已删除', 'info');
    };

    // ============================================================
    //  导出 & 清空
    // ============================================================
    function exportAll() {
        const a = allArticles[currentCategory] || [];
        if (!a.length) { showToast('没有文章可导出', 'error'); return; }
        let content = `# ${CATEGORY_LABELS[currentCategory] || currentCategory} 热点合集\n`;
        content += `生成: ${new Date().toLocaleString()}\n\n${'='.repeat(50)}\n\n`;
        a.forEach((x, i) => {
            content += `## ${i+1}. ${x.title}\n\n${x.body}\n\n> ${x.summary}\n\n---\n\n`;
        });
        navigator.clipboard?.writeText(content).then(() => showToast(`已复制 ${a.length} 篇`, 'success')).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = content;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast(`已复制 ${a.length} 篇`, 'success');
        });
    }

    function clearCurrent() {
        const a = allArticles[currentCategory] || [];
        if (!a.length) { showToast('没有文章', 'info'); return; }
        if (!confirm(`清空「${CATEGORY_LABELS[currentCategory]}」？`)) return;
        allArticles[currentCategory] = [];
        renderArticles();
        showToast('已清空', 'info');
    }

    generateBtn.addEventListener('click', () => generateArticles(currentCategory));
    exportAllBtn.addEventListener('click', exportAll);
    clearBtn.addEventListener('click', clearCurrent);

    document.querySelectorAll('#categorySelector button').forEach(b => {
        b.addEventListener('click', function() {
            document.querySelectorAll('#categorySelector button').forEach(x => x.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.cat;
            renderArticles();
        });
    });

    // ============================================================
    //  问答
    // ============================================================
    async function sendQa() {
        const text = qaInput.value.trim();
        if (!text || isQaLoading) return;

        if (!CONFIG.apiKey) { showToast('请先配置 API Key', 'error'); return; }

        isQaLoading = true;
        qaSendBtn.disabled = true;
        qaStatus.textContent = '思考中...';
        qaStatus.className = 'qa-status';

        // 用户消息
        const userMsg = document.createElement('div');
        userMsg.className = 'msg user';
        userMsg.innerHTML = esc(text) + `<span class="time-label">${new Date().toLocaleTimeString()}</span>`;
        qaMessages.appendChild(userMsg);
        qaInput.value = '';

        // 加载指示
        const loadingMsg = document.createElement('div');
        loadingMsg.className = 'msg loading';
        loadingMsg.innerHTML = `<span class="dots"><span></span><span></span><span></span></span> 思考中...`;
        qaMessages.appendChild(loadingMsg);
        qaMessages.scrollTop = qaMessages.scrollHeight;

        try {
            const msgs = [
                { role: 'system', content: '你是一位智能助手，请简洁、准确地回答问题。' },
                ...qaHistory,
                { role: 'user', content: text }
            ];
            const reply = await callLLM(msgs);

            // 移除加载
            loadingMsg.remove();

            // 助手回复
            const assistantMsg = document.createElement('div');
            assistantMsg.className = 'msg assistant';
            assistantMsg.innerHTML = esc(reply) + `<span class="time-label">${new Date().toLocaleTimeString()}</span>`;
            qaMessages.appendChild(assistantMsg);

            qaHistory.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
            if (qaHistory.length > 20) qaHistory = qaHistory.slice(-20);

            qaStatus.textContent = '就绪';
            qaStatus.className = 'qa-status';
        } catch (err) {
            loadingMsg.remove();
            const errMsg = document.createElement('div');
            errMsg.className = 'msg error';
            errMsg.textContent = '错误: ' + err.message;
            qaMessages.appendChild(errMsg);
            qaStatus.textContent = '错误';
            qaStatus.className = 'qa-status';
            showToast('问答失败: ' + err.message, 'error');
        }

        isQaLoading = false;
        qaSendBtn.disabled = false;
        qaMessages.scrollTop = qaMessages.scrollHeight;
    }

    qaSendBtn.addEventListener('click', sendQa);
    qaInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault();
            sendQa(); }
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
            sendQa(); }
    });

    qaClearBtn.addEventListener('click', () => {
        qaMessages.innerHTML =
            `<div class="msg assistant">对话已清空。输入问题开始新的对话。<span class="time-label">系统</span></div>`;
        qaHistory = [];
        qaStatus.textContent = '就绪';
        qaStatus.className = 'qa-status';
        showToast('已清空对话', 'info');
    });

    // 自动调整高度
    qaInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    // ============================================================
    //  启动
    // ============================================================
    loadConfig();
    loadPrompt();
    renderArticles();
    console.log('文章工坊已加载');
</script>
</body>
</html>
