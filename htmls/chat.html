<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Quicksand', 'Microsoft YaHei', sans-serif;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffe5d9 0%, #ffcad4 40%, #ffd6e0 70%, #f0e6ff 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 50%; left: 20%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255,182,193,0.4) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            top: 30%; right: 10%;
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(255,218,185,0.4) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        h1 {
            width: 10vw;
            text-align: center;
            color: #d4507d;
            text-shadow: 0 2px 8px rgba(212, 80, 125, 0.25);
            font-size: 26px;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        h1::before {
            content: '💗';
            margin-right: 6px;
            animation: heartbeat 2s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .container {
            width: 60vw;
            height: 95%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .right {
            width: 23vw;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        .chat-box {
            width: 100%;
            height: 98%;
            border: none;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(150%);
            border-radius: 30px;
            box-shadow:
                0 10px 40px rgba(212, 80, 125, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            padding: 18px 22px;
            display: flex;
            flex-direction: column;
        }
        .peer-info {
            text-align: right;
            font-size: 13px;
            color: #d4507d;
            font-weight: 600;
            padding: 6px 14px;
            background: linear-gradient(135deg, rgba(255,154,158,0.15), rgba(250,208,196,0.15));
            border-radius: 20px;
            align-self: flex-end;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .peer-info::before { content: '✨ 我的ID: '; }
        .peer-info span { font-weight: 700; color: #c2185b; }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(255,245,248,0.9) 0%, rgba(255,249,240,0.9) 100%);
            scroll-behavior: smooth;
            border: 1px solid rgba(255,209,220,0.5);
            min-height: 200px;
        }
        #chat-container::-webkit-scrollbar { width: 6px; }
        #chat-container::-webkit-scrollbar-track { background: transparent; }
        #chat-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ffb6c1, #ffcba4);
            border-radius: 10px;
        }

        .message-wrapper {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.3s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message {
            padding: 11px 16px;
            border-radius: 18px;
            max-width: 72%;
            word-wrap: break-word;
            word-break: break-word;
            font-size: 14.5px;
            line-height: 1.55;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        .message-time {
            font-size: 10.5px;
            color: #b8a9c9;
            margin-top: 4px;
            opacity: 0.75;
            letter-spacing: 0.3px;
        }
        .local-wrapper { align-items: flex-end; }
        .remote-wrapper {
            flex-direction: row;
            align-items: flex-start;
            gap: 9px;
        }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            margin-top: 2px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 3px 10px rgba(212, 80, 125, 0.18);
        }
        .msg-body {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 0;
            max-width: 78%;
        }
        .msg-name {
            font-size: 11.5px;
            font-weight: 600;
            color: #a08fa0;
            margin-bottom: 4px;
            padding-left: 6px;
            letter-spacing: 0.4px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .msg-body .message { max-width: 100%; }
        .media-msg {
            display: block;
            max-width: 260px;
            max-height: 320px;
            border-radius: 12px;
            object-fit: cover;
        }
        .message.remote .media-msg { border: 2px solid rgba(255, 255, 255, 0.85); }
        .message.local .media-msg { border: 2px solid rgba(255, 255, 255, 0.6); }
        .local {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: #5a3d3d;
            border-bottom-right-radius: 6px;
        }
        .remote {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            color: #3d4f5a;
            border-bottom-left-radius: 6px;
        }
        .system {
            color: #c9a0dc;
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 14px;
            padding: 6px 16px;
            font-size: 12.5px;
            max-width: none;
            margin: 6px auto;
            border: 1px dashed rgba(201,160,220,0.4);
        }
        .system-wrapper { align-items: center; }

        input[type="text"] {
            padding: 10px 16px;
            border: 2px solid #ffd1dc;
            border-radius: 22px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
            background-color: #fff9fb;
            color: #5a3d3d;
        }
        input[type="text"]:focus {
            border-color: #ff9a9e;
            box-shadow: 0 0 0 3px rgba(255, 154, 158, 0.15);
        }
        button {
            padding: 10px 22px;
            border: none;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: white;
            border-radius: 22px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(255, 154, 158, 0.35);
            letter-spacing: 1px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 154, 158, 0.45);
        }
        button:active { transform: translateY(0); }
        button:disabled {
            background: #e0e0e0;
            color: #9e9e9e;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        .steps {
            font-size: 13px;
            color: #9a8c98;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-top: 0;
        }
        .steps .step {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
            line-height: 1.4;
        }
        .steps .step:last-child { margin-bottom: 0; }
        .step.active {
            font-weight: 700;
            color: #c2185b;
            background: linear-gradient(135deg, rgba(255,154,158,0.2), rgba(250,208,196,0.2));
        }

        #step-1-container, #step-2-container {
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        #step-1-container input, #step-2-container input {
            width: 100%;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        #step-1-container button, #step-2-container button {
            width: 100%;
            padding: 12px;
        }

        #step-3-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding: 10px 12px;
            min-width: 0;
            background: rgba(255, 249, 251, 0.9);
            border-radius: 22px;
            border: 1px solid rgba(255, 209, 220, 0.5);
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.1);
        }
        #message-input {
            flex: 1 1 0;
            min-width: 0;
            width: 0;
            border: none;
            background: transparent;
            font-size: 14.5px;
            color: #5a3d3d;
            padding: 8px 14px;
            border-radius: 18px;
        }
        #message-input::placeholder { color: #c9b8c9; }
        #message-input:focus {
            border: none;
            box-shadow: none;
            background: rgba(255, 255, 255, 0.7);
        }
        .input-btns {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: all 0.25s ease;
            background: transparent;
            box-shadow: none;
            padding: 0;
        }
        .btn-icon:hover { transform: scale(1.12); box-shadow: none; }
        .btn-icon:active { transform: scale(0.95); }

        #send-button {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            box-shadow: 0 3px 12px rgba(255, 154, 158, 0.5);
            color: white;
        }
        #send-button:hover {
            background: linear-gradient(135deg, #ff8088 0%, #f5b8a8 100%);
            box-shadow: 0 5px 18px rgba(255, 154, 158, 0.6);
        }
        #send-button svg { width: 18px; height: 18px; fill: white; }

        .file-upload-label {
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            box-shadow: 0 3px 12px rgba(161, 196, 253, 0.5);
            transition: all 0.25s ease;
        }
        .file-upload-label:hover {
            transform: scale(1.12);
            box-shadow: 0 5px 18px rgba(161, 196, 253, 0.6);
        }
        .file-upload-label svg { width: 18px; height: 18px; fill: white; }

        #file-input { display: none; }

        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-24px) scale(0.94);
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 14px 26px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid rgba(255, 209, 220, 0.9);
            border-radius: 22px;
            box-shadow: 0 14px 40px rgba(212, 80, 125, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }
        .toast-icon {
            font-size: 28px;
            animation: toastPop 1.6s ease-in-out infinite;
        }
        @keyframes toastPop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.14); }
        }
        .toast-main {
            font-size: 14.5px;
            font-weight: 700;
            color: #d4507d;
            letter-spacing: 0.5px;
        }
        .toast-sub {
            display: block;
            margin-top: 3px;
            font-size: 11.5px;
            font-weight: 500;
            color: #b8a9c9;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <h1>介怀</h1>
    <div class="container">
        <div class="chat-box">
            <div class="peer-info" id="peer-info"></div>
            <div id="chat-container"></div>

            <div id="step-3-container" style="display: none;">
                <input type="text" id="message-input" placeholder="说点什么吧~ 回车发送 💌">
                <div class="input-btns">
                    <label for="file-input" class="file-upload-label" title="发送图片/视频">
                        <svg viewBox="0 0 24 24"><path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4.86 8.86l-3 3.87L9 13.14 6 17h12l-3.86-5.14zM7 8.5c0 .83-.67 1.5-1.5 1.5S4 9.33 4 8.5 4.67 7 5.5 7 7 7.67 7 8.5z"/></svg>
                    </label>
                    <input type="file" id="file-input" accept="image/*,video/*">
                    <button id="send-button" class="btn-icon" title="发送">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="right">
        <!-- 步骤菜单 -->
        <div class="steps">
            <div class="step active" id="step-1">步骤 1: 创建ID</div>
            <div class="step" id="step-2">步骤 2: 输入对方的ID并连接</div>
            <div class="step" id="step-3">步骤 3: 开始聊天</div>
        </div>

        <!-- 创建Peer的输入框 -->
        <div id="step-1-container">
            <input type="text" id="custom-peer-id" placeholder="输入自定义ID（可选）">
            <button id="create-peer-button">创建</button>
        </div>

        <!-- 连接输入框 -->
        <div id="step-2-container" style="display: none;">
            <input type="text" id="peer-id" placeholder="输入对方的Peer ID">
            <button id="connect-button">连接</button>
        </div>
    </div>

    <div class="toast" id="conn-toast">
        <div>
            <div class="toast-main" id="toast-main">连接成功</div>
            <span class="toast-sub" id="toast-sub"></span>
        </div>
    </div>

    <script>
        let peer;
        let conn;
        const incomingFiles = {};
        const FILE_CHUNK_SIZE = 16000;
        let myNickname = '';
        let remoteNickname = '';
        const AVATAR_POOL = ['🦊', '🐼', '🐰', '🐨', '🐻', '🐯', '🦁', '🐮', '🐸', '🐵', '🐧', '🦄'];
        let remoteAvatar = '🐼';
        let myAvatar = '🦊';

        function hashPick(str) {
            let sum = 0;
            for (let i = 0; i < str.length; i++) sum += str.charCodeAt(i);
            return AVATAR_POOL[sum % AVATAR_POOL.length];
        }

        function showToast(main, sub, icon) {
            const toast = document.getElementById('conn-toast');
            document.getElementById('toast-main').textContent = main;
            document.getElementById('toast-sub').textContent = sub || '';
            toast.classList.add('show');
            clearTimeout(showToast._timer);
            showToast._timer = setTimeout(() => toast.classList.remove('show'), 2800);
        }

        function setupConnection(connection, isIncoming) {
            conn = connection;
            conn.on('data', (data) => handleIncoming(data, conn.peer));
            conn.on('open', () => {
                addMessage('系统', '连接已建立', 'system');
                setStep(3);

                const id = conn.peer;
                remoteAvatar = hashPick(id);
                remoteNickname =id.slice(0, 6);
                if (!myNickname && peer && peer.id) myNickname = peer.id.slice(0, 6);

                if (isIncoming) {
                    showToast('有人来陪你啦', remoteNickname + ' 已经连上你了', '🌟');
                } else {
                    showToast('连接成功', '已和 ' + remoteNickname + ' 牵手成功');
                }

                conn.send({ type: 'hello', nickname: myNickname, avatar: myAvatar });
            });
        }

        // 创建Peer实例，并显示用户ID
        document.getElementById('create-peer-button').onclick = () => {
            const customId = document.getElementById('custom-peer-id').value.trim();
            peer = customId ? new Peer(customId) : new Peer();  // 如果自定义ID不为空，则使用该ID，否则自动生成ID

            peer.on('open', (id) => {
                document.getElementById('peer-info').innerHTML = '<span>' + id + '</span>';
                myAvatar = hashPick(id);
                if (customId) myNickname = customId;
                setStep(2);
            });

            peer.on('connection', (connection) => setupConnection(connection, true));
        };

        // 连接按钮点击事件
        document.getElementById('connect-button').onclick = () => {
            const peerId = document.getElementById('peer-id').value.trim();
            if (!peerId) {
                showToast('还没填ID哦', '请输入对方的 Peer ID', '✏️');
                return;
            }

            conn = peer.connect(peerId);
            setupConnection(conn, false);

            conn.on('error', (err) => {
                showToast('连接失败', String(err), '😢');
            });
        };

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (message && conn && conn.open) {
                conn.send(message);
                addMessage(peer.id, message, 'local');
                input.value = '';
            }
        }

        document.getElementById('send-button').onclick = sendMessage;

        document.getElementById('message-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // 发送文件按钮点击事件//选择文件之后自动发文件
        // 获取文件输入框
        const fileInput = document.getElementById('file-input');
        fileInput.addEventListener('change', function () {
            const file = fileInput.files[0];
            if (!file) return;
            if (!conn || !conn.open) {
                showToast('还没连上呢', '先和对方建立连接再发文件吧', '🔗');
                fileInput.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = (eventt) => {
                const fileContent = eventt.target.result;
                renderMediaMessage(fileContent, 'local', peer ? peer.id : '我');
                sendFileInChunks(fileContent);
            };
            reader.readAsDataURL(file);
            fileInput.value = '';
        });

        function sendFileInChunks(fileContent) {
            const fileId = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
            const total = Math.ceil(fileContent.length / FILE_CHUNK_SIZE);
            let index = 0;
            const sendNext = () => {
                if (!conn || !conn.open || index >= total) return;
                const chunk = fileContent.slice(index * FILE_CHUNK_SIZE, (index + 1) * FILE_CHUNK_SIZE);
                conn.send({ type: 'file-chunk', fileId, index, total, content: chunk });
                index++;
                setTimeout(sendNext, 10);
            };
            sendNext();
        }

        function handleIncoming(data, senderId) {
            if (!data || typeof data !== 'object') {
                addMessage(senderId, data, 'remote');
                return;
            }
            if (data.type === 'hello') {
                if (data.nickname) remoteNickname = data.nickname;
                if (data.avatar) remoteAvatar = data.avatar;
                return;
            }
            if (data.type === 'file-chunk') {
                let item = incomingFiles[data.fileId];
                if (!item) {
                    item = incomingFiles[data.fileId] = { total: data.total, received: 0, parts: [] };
                }
                if (item.parts[data.index] === undefined) {
                    item.parts[data.index] = data.content;
                    item.received++;
                }
                if (item.received === item.total) {
                    const fullData = item.parts.join('');
                    delete incomingFiles[data.fileId];
                    renderMediaMessage(fullData, 'remote', senderId);
                }
                return;
            }
            if (data.type === 'file') {
                renderMediaMessage(data.content, 'remote', senderId);
                return;
            }
            addMessage(senderId, data, 'remote');
        }

        function getTimeStr() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        }

        function buildRemoteWrapper(messageDiv) {
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'message-wrapper remote-wrapper';

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.textContent = remoteAvatar;

            const bodyDiv = document.createElement('div');
            bodyDiv.className = 'msg-body';

            const nameDiv = document.createElement('div');
            nameDiv.className = 'msg-name';
            nameDiv.textContent = remoteNickname || '伙伴';

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.style.textAlign = 'left';
            timeDiv.textContent = getTimeStr();

            bodyDiv.appendChild(nameDiv);
            bodyDiv.appendChild(messageDiv);
            bodyDiv.appendChild(timeDiv);

            wrapperDiv.appendChild(avatarDiv);
            wrapperDiv.appendChild(bodyDiv);
            return wrapperDiv;
        }

        function renderMediaMessage(fileData, side, senderName) {
            const chatContainer = document.getElementById('chat-container');

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${side}`;

            const fileType = fileData.substring(5, fileData.indexOf('/'));
            if (fileType === 'image') {
                const img = document.createElement('img');
                img.src = fileData;
                img.className = 'media-msg';
                messageDiv.appendChild(img);
            } else if (fileType === 'video') {
                const video = document.createElement('video');
                video.src = fileData;
                video.controls = true;
                video.className = 'media-msg';
                messageDiv.appendChild(video);
            } else {
                const link = document.createElement('a');
                link.href = fileData;
                link.download = 'file';
                link.textContent = '📎 点击下载文件';
                link.style.color = 'inherit';
                messageDiv.appendChild(link);
            }

            if (side === 'local') {
                const wrapperDiv = document.createElement('div');
                wrapperDiv.className = 'message-wrapper local-wrapper';

                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.style.textAlign = 'right';
                timeDiv.textContent = getTimeStr();

                wrapperDiv.appendChild(messageDiv);
                wrapperDiv.appendChild(timeDiv);
                chatContainer.appendChild(wrapperDiv);
            } else {
                chatContainer.appendChild(buildRemoteWrapper(messageDiv));
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addMessage(sender, text, type) {
            const chatContainer = document.getElementById('chat-container');

            if (type === 'system') {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message system';
                messageDiv.innerHTML = `<span class="message-content">${text}</span>`;
                chatContainer.appendChild(messageDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                return;
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = `<span class="message-content">${text}</span>`;

            if (type === 'local') {
                const wrapperDiv = document.createElement('div');
                wrapperDiv.className = 'message-wrapper local-wrapper';

                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.style.textAlign = 'right';
                timeDiv.textContent = getTimeStr();

                wrapperDiv.appendChild(messageDiv);
                wrapperDiv.appendChild(timeDiv);
                chatContainer.appendChild(wrapperDiv);
            } else {
                chatContainer.appendChild(buildRemoteWrapper(messageDiv));
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 设置步骤状态
        function setStep(stepNumber) {
            const steps = document.querySelectorAll('.step');
            steps.forEach((step, index) => {
                if (index + 1 === stepNumber) {
                    step.classList.add('active');
                    step.style.fontWeight = 'bold';
                } else {
                    step.classList.remove('active');
                    step.style.fontWeight = 'normal';
                }
            });

            // 根据步骤显示相应的界面
            switch (stepNumber) {
                case 1:
                    document.getElementById('step-1-container').style.display = 'block';
                    document.getElementById('step-2-container').style.display = 'none';
                    document.getElementById('step-3-container').style.display = 'none';
                    break;
                case 2:
                    document.getElementById('step-1-container').style.display = 'none';
                    document.getElementById('step-2-container').style.display = 'block';
                    document.getElementById('step-3-container').style.display = 'none';
                    break;
                case 3:
                    document.getElementById('step-1-container').style.display = 'none';
                    document.getElementById('step-2-container').style.display = 'none';
                    document.getElementById('step-3-container').style.display = 'flex';
                    break;
                default:
                    break;
            }
        }
    </script>
</body>
</html>
